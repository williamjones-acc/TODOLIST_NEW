<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="logo">
            <img src="todolist.png" alt="Todo List Logo">
        </div>

        <h1>To-Do List</h1>

        <p class="subtitle">
            Catat tugas kamu dengan mudah
        </p>


        <div class="input-section">

            <input
                type="text"
                id="taskInput"
                placeholder="Masukkan tugas..."
            >

            <button id="addBtn">
                Tambah
            </button>

        </div>


        <div class="task-section">

            <h2>Daftar Tugas</h2>

            <ul id="taskList">

                <!-- Tugas akan dibuat oleh JavaScript -->

            </ul>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
